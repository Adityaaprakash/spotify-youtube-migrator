global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

rule_files:
  - "alerts.yml"

scrape_configs:
  - job_name: "spotify-youtube-migrator"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    scrape_timeout: 8s
    static_configs:
      - targets: ["host.docker.internal:8080"]
        labels:
          application: "spotify-youtube-migrator"
          environment: "local"
