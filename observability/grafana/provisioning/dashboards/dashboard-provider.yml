apiVersion: 1

providers:
  - name: "Spotify-YouTube Migrator Dashboards"
    orgId: 1
    folder: "Spotify-YouTube Migrator"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
