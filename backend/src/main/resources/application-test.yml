spring:
  datasource:
    url: jdbc:tc:postgresql:16:///spotify_youtube_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  jpa:
    hibernate:
      ddl-auto: validate

  flyway:
    enabled: true

oauth:
  encryption:
    key: 1234567890abcdef1234567890abcdef12345678123=
  providers:
    spotify:
      client-id: "test-spotify-id"
      client-secret: "test-spotify-secret"
      redirect-uri: "http://localhost/api/oauth/spotify/callback"
      scopes: "user-read-private user-read-email playlist-read-private playlist-read-collaborative"
    google:
      client-id: "test-google-id"
      client-secret: "test-google-secret"
      redirect-uri: "http://localhost/api/oauth/google/callback"
      scopes: "openid email profile"
