spring:
  datasource:
    url: ${TEST_DATABASE_URL:${DATABASE_URL:jdbc:tc:postgresql:16:///spotify_youtube_test?options=-c%20timezone=UTC}}
    driver-class-name: ${TEST_DATABASE_DRIVER:org.testcontainers.jdbc.ContainerDatabaseDriver}
    username: ${TEST_DATABASE_USERNAME:${DATABASE_USERNAME:postgres}}
    password: ${TEST_DATABASE_PASSWORD:${DATABASE_PASSWORD:postgres}}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true

oauth:
  encryption:
    key: 1234567890abcdef1234567890abcdef12345678123=
  providers:
    spotify:
      client-id: "test-spotify-id"
      client-secret: "test-spotify-secret"
      redirect-uri: "http://localhost/api/oauth/spotify/callback"
      scopes: "user-read-private user-read-email playlist-read-private playlist-read-collaborative"
    google:
      client-id: "test-google-id"
      client-secret: "test-google-secret"
      redirect-uri: "http://localhost/api/oauth/google/callback"
      scopes: "openid email profile https://www.googleapis.com/auth/youtube.force-ssl"

youtube:
  api-key: "test-youtube-api-key"
  base-url: "https://www.googleapis.com/youtube/v3"
  connect-timeout-ms: 5000
  read-timeout-ms: 10000
  max-results-limit: 50
  default-max-results: 25

cors:
  allowed-origins: "http://localhost:5173,http://localhost:3000"

security:
  rate-limiting:
    enabled: true
    trust-forwarded-headers: true
    max-tracked-keys: 10000
    login:
      max-requests: 100
      window-seconds: 60
      retry-after-seconds: 60
    register:
      max-requests: 100
      window-seconds: 60
      retry-after-seconds: 60
    oauth:
      max-requests: 100
      window-seconds: 60
      retry-after-seconds: 30
    search:
      max-requests: 100
      window-seconds: 60
      retry-after-seconds: 15
    migration:
      max-requests: 100
      window-seconds: 60
      retry-after-seconds: 30

migration:
  scheduler:
    enabled: false
