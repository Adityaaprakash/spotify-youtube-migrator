spring:
  profiles:
    active: ${APP_ENV:local}
  application:
    name: migrator

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        # Use HTTPS in production, fallback to false for local dev
        secure: ${SERVER_SECURE_COOKIE:false}

oauth:
  encryption:
    key: ${OAUTH_ENCRYPTION_KEY:1234567890abcdef1234567890abcdef12345678123=}
  providers:
    spotify:
      client-id: ${SPOTIFY_CLIENT_ID:mock-spotify-client-id}
      client-secret: ${SPOTIFY_CLIENT_SECRET:mock-spotify-secret}
      redirect-uri: ${SPOTIFY_REDIRECT_URI:http://localhost:8080/api/oauth/spotify/callback}
      scopes: user-read-private user-read-email playlist-read-private playlist-read-collaborative
    google:
      client-id: ${GOOGLE_CLIENT_ID:mock-google-client-id}
      client-secret: ${GOOGLE_CLIENT_SECRET:mock-google-secret}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/api/oauth/google/callback}
      scopes: openid email profile https://www.googleapis.com/auth/youtube.force-ssl
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

youtube:
  api-key: ${YOUTUBE_API_KEY:mock-youtube-api-key}
  base-url: ${YOUTUBE_BASE_URL:https://www.googleapis.com/youtube/v3}
  connect-timeout-ms: ${YOUTUBE_CONNECT_TIMEOUT_MS:5000}
  read-timeout-ms: ${YOUTUBE_READ_TIMEOUT_MS:10000}
  max-results-limit: ${YOUTUBE_MAX_RESULTS_LIMIT:50}
  default-max-results: ${YOUTUBE_DEFAULT_MAX_RESULTS:25}

review:
  search:
    default-max-results: ${REVIEW_SEARCH_DEFAULT_MAX_RESULTS:10}
    max-results-limit: ${REVIEW_SEARCH_MAX_RESULTS_LIMIT:50}
    min-results-limit: ${REVIEW_SEARCH_MIN_RESULTS_LIMIT:1}
    max-queries-per-track: ${REVIEW_SEARCH_MAX_QUERIES_PER_TRACK:2}
    max-query-length: ${REVIEW_SEARCH_MAX_QUERY_LENGTH:500}

migration:
  progress:
    rate-limit:
      enabled: ${MIGRATION_PROGRESS_RATE_LIMIT_ENABLED:true}
      max-requests: ${MIGRATION_PROGRESS_RATE_LIMIT_MAX_REQUESTS:60}
      window-seconds: ${MIGRATION_PROGRESS_RATE_LIMIT_WINDOW_SECONDS:60}
      retry-after-seconds: ${MIGRATION_PROGRESS_RATE_LIMIT_RETRY_AFTER_SECONDS:5}
  scheduler:
    enabled: ${MIGRATION_SCHEDULER_ENABLED:true}
    poll-interval-ms: ${MIGRATION_SCHEDULER_POLL_INTERVAL_MS:5000}
    heartbeat-interval-ms: ${MIGRATION_SCHEDULER_HEARTBEAT_INTERVAL_MS:15000}
    lease-duration-seconds: ${MIGRATION_SCHEDULER_LEASE_DURATION_SECONDS:60}
    rejection-backoff-seconds: ${MIGRATION_SCHEDULER_REJECTION_BACKOFF_SECONDS:10}
    shutdown-grace-period-seconds: ${MIGRATION_SCHEDULER_SHUTDOWN_GRACE_PERIOD_SECONDS:30}
    max-claims-per-poll: ${MIGRATION_SCHEDULER_MAX_CLAIMS_PER_POLL:4}
  idempotency:
    cleanup-interval-ms: ${MIGRATION_IDEMPOTENCY_CLEANUP_INTERVAL_MS:3600000}



