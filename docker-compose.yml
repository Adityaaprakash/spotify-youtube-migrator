services:
  postgres:
    image: postgres:16
    container_name: spotify_youtube_db
    environment:
      POSTGRES_USER: ${DATABASE_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: spotify_youtube
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d spotify_youtube"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
